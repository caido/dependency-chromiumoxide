[package]
name = "chromiumoxide_fetcher"
version = "0.9.1"
authors = ["Matthias Seitz <matthias.seitz@outlook.de>"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Contains a chromium fetcher"
homepage = "https://github.com/mattsse/chromiumoxide"
repository = "https://github.com/mattsse/chromiumoxide"
readme = "../README.md"
include = ["src/**/*", "LICENSE-*"]

[lib]
name = "chromiumoxide_fetcher"
path = "src/lib.rs"
doctest = false

[[test]]
name = "chromiumoxide_fetcher"
path = "tests/lib.rs"
harness = true

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = [
  "rustls-tls",
], default-features = false }
tokio = { version = "1", features = ["rt", "fs", "process", "macros"] }

[dependencies]
thiserror = "2"
anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
zip9 = { package = "zip", version = "9.1.2", default-features = false, features = [
    "deflate-flate2-zlib-rs",
], optional = true }
tokio = { version = "1", features = ["fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-version = "0.1"

[features]
default = ["rustls", "zip9"]

rustls = ["reqwest/rustls-tls-native-roots"]
native-tls = ["reqwest/native-tls"]
